# English copy. Every word a consumer can see lives in a file like this one.
#
# Adding Arabic means adding ar.toml with the same keys — no code change.
#
# THE RULE: no entry here may contain failure language. Not "sorry", not
# "unfortunately", not "no availability", not "unable to". When an aggregator
# has nothing, the router advances; when the list is exhausted, a human takes
# over. The consumer sees a pivot, never an empty shelf.
#
# tests/cascade/test_no_empty_shelves.py scans every entry in every locale and
# fails the build on a violation.

locale = "en"

# Bump when the consent wording below changes. Recorded against every consent
# event so an audit shows which version a consumer actually read.
policy_version = "2026-07-01"

[phrases]

# --- Greetings -------------------------------------------------------------
"greeting.welcome" = "Hey — I'm Mawjood 👋 Tell me what you're after and I'll line it up. A haircut, a table, a spa slot, whatever you need."

"greeting.returning" = "Welcome back 👋 What can I line up for you today?"

# --- PDPL consent ----------------------------------------------------------
# Shown on first contact. Mawjood keeps helping while it is displayed; an
# affirmative reply is required before any personal data reaches a venue
# (decision 4). DRAFT — written for the operator's legal review.
"consent.notice" = "Quick bit of housekeeping: I keep your number and what you tell me so I can make your booking and confirm it back to you. Your details go to the venue you book with, and nowhere else. Reply STOP at any time and I'll stop right there and leave your details alone."

"consent.acknowledged" = "Noted, thank you. Now — what are you after?"

"consent.withdrawn" = "Done — I've stopped there and I won't use your details any further. Message me any time if you'd like to pick this back up."

# --- Gathering the request -------------------------------------------------
"ask.what_you_need" = "Tell me what you need — roughly what, where, and when is plenty to start."

"ack.received" = "Got it. Give me a moment and I'll line up your options."

# --- The graceful pivot ----------------------------------------------------
# These two carry the invariant. They are what a consumer sees when an
# aggregator returns nothing, errors, or the turn budget expires mid-cascade.
# They must read as momentum, never as an apology.
"pivot.holding" = "Let me check a few more options for you — one moment."

"pivot.still_looking" = "Still on it — lining up a couple more for you. I'll come straight back."

# --- Handoff ---------------------------------------------------------------
# The floor beneath the invariant. Reads as an upgrade in service, because
# from the consumer's side that is exactly what it is.
"handoff.connecting" = "I'm bringing in one of our team to take this the rest of the way — they'll pick up right here in a moment."

# --- Clarification ---------------------------------------------------------
# Deliberately not "I didn't understand". Asks forward instead of reporting a
# shortcoming.
"fallback.unclear" = "Give me a little more to go on — what are you after, and roughly where and when?"

# --- Resuming after a gap ---------------------------------------------------
"greeting.resumed" = "Good to hear from you again. Where were we — shall I pick up where we left off?"

# --- Filling in the details ------------------------------------------------
# One question at a time. A single question reads like a concierge; three at once
# reads like a form.
"ask.service" = "What are you after? A haircut, a treatment, a table — whatever it is, I'll find it."

"ask.area" = "Whereabouts suits you?"

"ask.when" = "When were you thinking?"

# $options is filled with the emirates a place name matches, e.g.
# "Al Nahda, Dubai or Al Nahda, Sharjah". Asking beats assuming: the wrong one is
# a forty-minute drive.
"clarify.area" = "Just so I get you to the right one — $options?"

"ack.changed" = "Noted — let me redo that."

# --- Presenting a slot -----------------------------------------------------
# $service $venue $area $day $time $price
"offer.slot" = "$service at $venue in $area — $day at $time, $price. Shall I lock it in?"

# Used when the upstream match was less than certain. Hedged on purpose, and it
# still requires an explicit yes.
"offer.slot_hedged" = "Closest match is $service at $venue in $area — $day at $time, $price. Worth a look if that suits. Shall I lock it in?"

"confirm.request" = "Just say the word and I'll book it."

# $venue $area $day $time $code
"booking.confirmed" = "Booked — $venue in $area, $day at $time. Your reference is $code. I'll send you a reminder beforehand."

# --- After a booking -------------------------------------------------------
# $venue $day $time
"post.status" = "You're down for $venue, $day at $time. All set."

"post.reschedule_ask" = "Of course — when would suit you better?"

"post.cancelled" = "That's cancelled. Anything else I can line up for you?"

# --- When a message carries nothing to act on ------------------------------
"fallback.emoji" = "I'll take that as a good sign. What can I line up for you?"

# v1 is English only. This is a statement of what Mawjood speaks, not an apology
# and not a dead end — it asks forward.
"language.english_only" = "English is what I've got for the moment — send it over in English and I'll take care of it."

# --- Scheduled messages ----------------------------------------------------
# Reminders, the follow-up and the satisfaction ask. Sent hours or days after
# the conversation, so most of them land outside WhatsApp's 24-hour session
# window and need an approved template. None is approved yet, so most of these
# cannot currently be sent — the scheduler blocks them and says so rather than
# pretending. See core/notifications/policy.py.
#
# Written short on purpose. An unprompted message is an interruption; it earns
# its place by being useful in one line.

# The day-before nudge, while the consumer can still move things around it.
# $venue $day $time
"notify.reminder_24h" = "Reminder — $venue $day at $time. See you there."

# The one that means "leave soon". Shorter on purpose.
# $venue $time
"notify.reminder_2h" = "$venue at $time today — see you shortly."

# $venue
"notify.follow_up" = "How did it go at $venue? Anything you'd like me to sort, just say."

# $venue
"notify.satisfaction" = "One quick thing on $venue — how would you rate it, 1 to 5?"

"notify.satisfaction_thanks" = "Thanks — noted. I'll keep it in mind next time I'm lining something up for you."
