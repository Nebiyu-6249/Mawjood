<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mawjood ops{% endblock %}</title>
  <style>
    /* No build step, no npm. One stylesheet, inline, done.

       The console is plain HTML forms and full-page redirects — it works with
       JavaScript disabled entirely. HTMX drops in on top when partial updates
       are wanted (a live queue, an inline reply); it is not vendored yet because
       nothing here needs it, and a script tag pointing at a file that does not
       exist is worse than no script tag. */
    :root {
      --ink: #1a1a1a; --muted: #6b6b6b; --line: #e2e2e2; --bg: #fbfbfa;
      --accent: #0f5c4a; --warn: #8a5a00; --consumer: #f4f4f2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
           color: var(--ink); background: var(--bg); }
    header { border-bottom: 1px solid var(--line); background: #fff; padding: .9rem 1.5rem;
             display: flex; align-items: baseline; gap: 1rem; }
    header h1 { font-size: 1rem; margin: 0; letter-spacing: .02em; }
    header .who { margin-left: auto; color: var(--muted); font-size: .85rem; }
    a { color: var(--accent); }
    main { max-width: 62rem; margin: 0 auto; padding: 1.5rem; }
    h2 { font-size: .95rem; text-transform: uppercase; letter-spacing: .06em;
         color: var(--muted); margin: 2rem 0 .75rem; }
    h2:first-child { margin-top: 0; }
    .cards { display: flex; gap: .75rem; flex-wrap: wrap; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 6px;
            padding: .8rem 1.1rem; min-width: 7rem; }
    .card .n { font-size: 1.6rem; font-weight: 600; }
    .card .l { color: var(--muted); font-size: .8rem; }
    table { width: 100%; border-collapse: collapse; background: #fff;
            border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    th, td { text-align: left; padding: .55rem .8rem; border-bottom: 1px solid var(--line);
             vertical-align: top; }
    th { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    tr:last-child td { border-bottom: 0; }
    .empty { color: var(--muted); padding: 1rem; background: #fff;
             border: 1px solid var(--line); border-radius: 6px; }
    form.inline { display: inline; }
    button { font: inherit; padding: .35rem .8rem; border: 1px solid var(--accent);
             background: var(--accent); color: #fff; border-radius: 4px; cursor: pointer; }
    button.ghost { background: #fff; color: var(--accent); }
    textarea { width: 100%; font: inherit; padding: .6rem; border: 1px solid var(--line);
               border-radius: 4px; resize: vertical; }
    code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .pill { display: inline-block; padding: .1rem .5rem; border-radius: 10px;
            font-size: .75rem; border: 1px solid var(--line); background: #fff; }
    .pill.warn { color: var(--warn); border-color: var(--warn); }
    .notice { background: #fff; border: 1px solid var(--warn); border-left-width: 3px;
              border-radius: 6px; padding: .8rem 1rem; color: var(--ink); }
  </style>
</head>
<body>
  <header>
    <h1>Mawjood <span style="color:var(--muted);font-weight:400">ops</span></h1>
    <a href="/console">queue</a>
    <a href="/console/notifications">scheduled</a>
    <span class="who">{{ operator }}</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
