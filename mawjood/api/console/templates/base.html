<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mawjood ops{% endblock %}</title>
  <style>
    /* No build step, no npm. One stylesheet, inline.

       The console is plain HTML and full-page navigation — it works with
       JavaScript disabled entirely. HTMX drops in on top when partial updates
       are wanted; it is not vendored yet because nothing here needs it, and a
       script tag pointing at a file that does not exist is worse than none. */
    :root {
      --ink: #16181d; --muted: #6b7280; --line: #e5e7eb; --bg: #fafafa;
      --accent: #0f5c4a; --accent-soft: #e8f2ef;
      --warn: #92400e; --warn-soft: #fef3c7;
      --bad: #9f1239; --bad-soft: #ffe4e6;
      --good: #14532d; --good-soft: #dcfce7;
      --consumer: #eef2ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
           color: var(--ink); background: var(--bg); }
    header { border-bottom: 1px solid var(--line); background: #fff; padding: .7rem 1.5rem;
             display: flex; align-items: center; gap: 1.1rem; flex-wrap: wrap;
             position: sticky; top: 0; z-index: 5; }
    header h1 { font-size: .95rem; margin: 0; letter-spacing: .01em; font-weight: 650; }
    header h1 span { color: var(--muted); font-weight: 400; }
    header nav { display: flex; gap: .95rem; flex-wrap: wrap; }
    header nav a { color: var(--muted); text-decoration: none; font-size: .875rem; }
    header nav a:hover { color: var(--accent); }
    header nav a.on { color: var(--accent); font-weight: 600; }
    header .who { margin-left: auto; color: var(--muted); font-size: .82rem; }
    a { color: var(--accent); }
    main { max-width: 74rem; margin: 0 auto; padding: 1.6rem 1.5rem 4rem; }
    h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em;
         color: var(--muted); margin: 2rem 0 .7rem; font-weight: 650; }
    h2:first-child { margin-top: 0; }
    .lede { color: var(--muted); font-size: .875rem; margin: -.3rem 0 .9rem; max-width: 52rem; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
             gap: .7rem; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: .8rem 1rem; }
    .card .n { font-size: 1.55rem; font-weight: 640; line-height: 1.15; }
    .card .l { color: var(--muted); font-size: .78rem; margin-top: .1rem; }

    table { width: 100%; border-collapse: collapse; background: #fff;
            border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
            font-size: .875rem; }
    th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--line);
             vertical-align: top; }
    th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
         color: var(--muted); font-weight: 620; background: #fcfcfc; }
    tr:last-child td { border-bottom: 0; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .scroll { overflow-x: auto; }

    .quiet { color: var(--muted); padding: 1rem; background: #fff;
             border: 1px solid var(--line); border-radius: 8px; }
    code { font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .pill { display: inline-block; padding: .08rem .5rem; border-radius: 999px;
            font-size: .74rem; border: 1px solid var(--line); background: #fff;
            white-space: nowrap; }
    .pill.good { color: var(--good); background: var(--good-soft); border-color: transparent; }
    .pill.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
    .pill.bad  { color: var(--bad);  background: var(--bad-soft);  border-color: transparent; }
    .pill.on   { color: var(--accent); background: var(--accent-soft); border-color: transparent; }

    .notice { background: #fff; border: 1px solid var(--warn); border-left-width: 3px;
              border-radius: 8px; padding: .8rem 1rem; margin-bottom: 1rem; }
    .bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden;
           min-width: 5rem; }
    .bar > i { display: block; height: 100%; background: var(--accent); }
    .tabs { display: flex; gap: .4rem; margin-bottom: .8rem; }
    .tabs a { padding: .25rem .7rem; border-radius: 999px; text-decoration: none;
              font-size: .82rem; border: 1px solid var(--line); background: #fff;
              color: var(--muted); }
    .tabs a.on { background: var(--accent); border-color: var(--accent); color: #fff; }

    form.card { max-width: 22rem; margin: 4rem auto; }
    label { display: block; font-size: .8rem; color: var(--muted); margin: .7rem 0 .2rem; }
    input[type=text], input[type=password] { width: 100%; font: inherit; padding: .45rem .6rem;
             border: 1px solid var(--line); border-radius: 6px; }
    button { font: inherit; padding: .4rem .9rem; border: 1px solid var(--accent);
             background: var(--accent); color: #fff; border-radius: 6px; cursor: pointer;
             margin-top: 1rem; }
    .error { color: var(--bad); font-size: .84rem; margin-top: .6rem; }
  </style>
</head>
<body>
  {% if operator %}
  <header>
    <h1>Mawjood <span>ops</span></h1>
    <nav>
      <a href="/console" class="{{ 'on' if nav == 'dashboard' }}">overview</a>
      <a href="/console/conversations" class="{{ 'on' if nav == 'conversations' }}">conversations</a>
      <a href="/console/bookings" class="{{ 'on' if nav == 'bookings' }}">bookings</a>
      <a href="/console/aggregators" class="{{ 'on' if nav == 'aggregators' }}">aggregators</a>
      <a href="/console/failures" class="{{ 'on' if nav == 'failures' }}">failures</a>
      <a href="/console/sources" class="{{ 'on' if nav == 'sources' }}">sources</a>
      <a href="/console/scheduled" class="{{ 'on' if nav == 'scheduled' }}">scheduled</a>
      <a href="/console/health" class="{{ 'on' if nav == 'health' }}">health</a>
    </nav>
    <span class="who">{{ operator }} · <a href="/console/logout">sign out</a></span>
  </header>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
