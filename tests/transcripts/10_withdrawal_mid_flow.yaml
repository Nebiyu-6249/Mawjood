name: STOP mid-flow
description: >
  A withdrawal outranks whatever else was happening. Collected details are
  dropped and any pending offer is cleared — continuing to hold a booking
  intention after someone has withdrawn would be exactly wrong.
new_lead: false
initial_consent: granted
initial_state: confirmation
initial_slots:
  service: haircut
  area: Dubai Marina
  date_text: tomorrow
turns:
  - user: "STOP"
    expect_phrases: [consent.withdrawn]
    expect_slots:
      service: null
      area: null
